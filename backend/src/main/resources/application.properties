server.port=8080
spring.application.name=medidoc

# ============================================================
# MONGODB ATLAS CLOUD DATABASE CONFIGURATION
# Set MONGODB_URI environment variable or replace connection string below
# ============================================================
spring.data.mongodb.uri=${MONGODB_URI}

jwt.secret=MediDocSecretKey2026VeryLongSecretKeyForJWTTokenSigning
jwt.expiration.ms=86400000

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

ai.service.url=http://localhost:5000
logging.level.com.medidoc=DEBUG
cors.allowed.origins=http://localhost:5500,http://127.0.0.1:5500,https://medidoc-new-frontend.vercel.app,https://*.vercel.app,https://projectfin-medidoc-4.onrender.com